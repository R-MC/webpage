<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Passing the Parcel</title>
  <style>
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .panel { border: 1px solid grey; height: 100px; padding: 10px; }
  </style>
</head>
<body>

  <h1>Click the button and watch the message move</h1>

  <div class="grid">
    <div class="panel" id="panel-1">
      <p id="message">I am the message.</p>
    </div>
    <div class="panel" id="panel-2"></div>
    <div class="panel" id="panel-3"></div>
    <div class="panel" id="panel-4"></div>
  </div>

  <button onclick="move()">Click here</button>

  <script>
    let n = 1;

    function move() {
      n = n % 4 + 1;
      document.getElementById("panel-" + n)
              .appendChild(document.getElementById("message"));
    }
  </script>

</body>
</html>
